[build]
  publish = "dist"   # change to your actual output folder; for a plain static site use "."

[[plugins]]
  package = "@netlify/plugin-sitemap"
  [plugins.inputs]
  prettyURLs = true
  generateRobotsTxt = false

# Force HTTPS and remove www
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.chiefs.idsaikc.com/*"
  to   = "https://chiefs.idsaikc.com/:splat"
  status = 301

# Helpful security/crawl headers
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Cache-Control = "public, max-age=0, must-revalidate"
